name: Playwright Tests
on:                                  # events: when this workflow runs
  push:
    branches: [ main ]               # …after anything lands on main
  pull_request:
    branches: [ main ]               # …for every pull request into main
jobs:
  test:                              # the job's name (it becomes the check's name)
    runs-on: ubuntu-latest           # the runner: a fresh Linux machine
    steps:
    - uses: actions/checkout@v6      # download your repo onto the runner
    - uses: actions/setup-node@v6    # install Node.js
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci                    # install exactly what package-lock.json says
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test