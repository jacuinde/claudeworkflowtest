<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Links</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1 id="page-title">Links</h1>
        <button id="theme-toggle" type="button" aria-pressed="false">
          <span aria-hidden="true">☾</span> Dark theme
        </button>
      </header>
      <input id="search" type="search" aria-label="Search links" placeholder="Search links" autocomplete="off" />
      <p id="match-count" aria-live="polite" hidden></p>
      <ul id="links" aria-labelledby="page-title"></ul>
      <p id="no-matches" hidden>No matches.</p>
      <p id="no-links" hidden>No links yet. Add one to <code>links.json</code>.</p>
      <p id="load-error" role="alert" hidden>Couldn't load links.</p>
    </main>
  </body>
</html>
